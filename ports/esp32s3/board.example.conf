# Board configuration for the ESP32-S3 port (EXAMPLE).
#
# An illustration for a generic ESP32-S3 board with 16 MB flash and octal
# PSRAM (e.g. ESP32-S3-DevKitC-1-N16R8 or a board with an ESP32-S3R8). With
# this file as it is, the desktop runs on the built-in USB Serial/JTAG port
# and nothing else is wired.
#
# Format: one "key = value" per line; '#' starts a comment; an empty value
# ("key =") unsets a key. GPIO and UART numbers are plain numbers, -1 means
# "not connected". Keys that are missing mean "this board does not have it".
#
# How it is used:
#   * Build time: the port builds in board.conf from this folder when it
#     exists (your own wiring; board.conf is in .gitignore), otherwise this
#     example. Copy this file to board.conf and edit it.
#   * Run time: /etc/board.conf on the device (the shell's `board` command
#     creates and edits it) overrides the built-in settings; restart after a
#     change. Prebuilt release firmware contains only this example, so users
#     of it configure their board this way.
#
# GPIOs to avoid on the ESP32-S3: 26-32 (flash), 33-37 (octal PSRAM on R8
# chips and modules), 19 and 20 (USB: the desktop's port), 0, 3, 45 and 46
# (strapping pins), 43 and 44 (UART0, the USB-UART chip on most boards).

# --- RS-485 lines (Modbus RTU `rtu1`, `rtu2`) ----------------------------
# Any UART: the desktop does not use one on this port.
#rs485.1.uart = 1
#rs485.1.tx   = 17
#rs485.1.rx   = 18
#rs485.1.de   = 16
#rs485.2.uart = 2
#rs485.2.tx   = 1
#rs485.2.rx   = 2
#rs485.2.de   = 42

# --- W6100 Ethernet on SPI (SPI2, its IO MUX pins) --------------------------
#eth.chip     = w6100
#eth.spi_host = 1        # SPI2_HOST (FSPI)
#eth.miso     = 13
#eth.mosi     = 11
#eth.sclk     = 12
#eth.cs       = 10
#eth.int      = 9
#eth.rst      = 14
#eth.spi_mhz  = 10
#eth.poll_ms  = 100

# --- SD card on SPI (`sd mount` puts it at /sd; `hwtest sd`) ---------------
#sd.cs        = 8
#sd.automount = 1          # mount the card at /sd at boot
