# Board configuration for the Elecrow CrowPanel 7.0 port (EXAMPLE).
#
# With this file as it is, the desktop is on the 7" LCD and its touch
# screen, the keyboard is a terminal on UART0 (the USB-C port) at 921600
# baud, which also shows the picture, and nothing else is wired.
#
# Format: one "key = value" per line; '#' starts a comment; an empty value
# ("key =") unsets a key. GPIO and UART numbers are plain numbers, -1 means
# "not connected". Keys that are missing mean "this board does not have it".
#
# How it is used:
#   * Build time: the port builds in board.conf from this folder when it
#     exists (your own wiring; board.conf is in .gitignore), otherwise this
#     example. Copy this file to board.conf and edit it.
#   * Run time: /etc/board.conf on the device (the shell's `board` command
#     creates and edits it) overrides the built-in settings; restart after a
#     change.
#
# Taken by the board (not for other uses): the LCD (GPIO0, 1, 3-9, 14-16,
# 21, 39-41, 45-48), its backlight (GPIO2), the touch screen's I2C
# (GPIO19, 20), the octal PSRAM (GPIO33-37), the flash (GPIO26-32) and
# UART0 (GPIO43, 44). Free on the connectors: GPIO38 (GPIO_D), and the
# I2C header shares GPIO19/20 with the touch screen.

# --- The desktop's keyboard (UART0) ----------------------------------------
#console.baud = 921600
# 1 (default): UART0 also shows the desktop (a terminal of the LCD's cells, 100x30
# with the default font); 0: the LCD
# only (UART0 stays the keyboard).
#lcd.mirror   = 1
# The LCD's pixel clock in MHz (10 to 40). Default 24 gives about 49 Hz,
# with bandwidth headroom for full-page drawing and filesystem access.
# Higher clocks can cause brief shifted pixels under rendering load.
#lcd.pclk_mhz = 24
# Text size: the font's height in pixels. 16 (default): 8x16, 100x30 cells;
# 20: 10x20, 80x24 cells; 24: 12x24, 66x20; 32: 16x32, 50x15. The larger
# fonts are Terminus Font (bold, SIL Open Font License): all text grows and
# stays sharp, and the desktop gets fewer cells. With lcd.mirror, set the PC
# terminal to the same size.
#lcd.font     = 16

# --- SD card on SPI (`sd mount` puts it at /sd; `hwtest sd`) ---------------
# The TF slot: MOSI GPIO11, MISO GPIO13, CLK GPIO12, CS GPIO10.
#sd.mosi      = 11
#sd.miso      = 13
#sd.sclk      = 12
#sd.cs        = 10
#sd.automount = 1          # mount the card at /sd at boot

# --- Kiosk mode: one Python app on the whole screen ------------------------
# The desktop starts with the app full screen: no taskbar, Start menu,
# desktop icons or window keys, and the app is started again if it ends.
# Way out: hold the top-right corner (finger or mouse) for 5 s, press F10
# three times within 2 s, or Ctrl+Alt+Delete (a keyboard on the board);
# root's password then leaves kiosk mode until the next restart.
# Maintenance start: press RESET, let go, then hold BOOT (GPIO0) for a moment
# within 1.5 s: the board starts without kiosk mode, this time only.
#kiosk.app       = /root/hmi.py   # a tdui script (.py or .mpy)
#kiosk.maint_pin = 0              # the BOOT button; -1: no maintenance start
