# Board configuration for the Arduino Nano ESP32 port (EXAMPLE).
#
# An illustration for a bare Nano ESP32 with nothing wired to it but USB.
# The desktop comes up on the USB-C connector and nothing else is connected.
#
# Format: one "key = value" per line; '#' starts a comment; an empty value
# ("key =") unsets a key. GPIO and UART numbers are plain numbers, -1 means
# "not connected". Keys that are missing mean "this board does not have it".
#
# How it is used:
#   * Build time: the port builds in board.conf from this folder when it
#     exists (your own wiring; board.conf is in .gitignore), otherwise this
#     example. Copy this file to board.conf and edit it.
#   * Run time: /etc/board.conf on the device (the shell's `board` command
#     creates and edits it) overrides the built-in settings; restart after a
#     change. Prebuilt release firmware contains only this example, so users
#     of it configure their board this way.
#
# GPIO NUMBERS, NOT ARDUINO PIN NAMES. TinyDesk is an ESP-IDF firmware and
# drives the SoC directly, so every number below is a raw GPIO. On the Nano
# ESP32 the Arduino names map like this (silkscreen -> GPIO):
#
#   D0 44  D1 43  D2  5  D3  6  D4  7  D5  8  D6  9  D7 10
#   D8 17  D9 18  D10 21 (SS)  D11 38 (MOSI)  D12 47 (MISO)
#   D13 48 (SCK, LED_BUILTIN)
#   A0  1  A1  2  A2  3  A3  4  A4 11 (SDA)  A5 12 (SCL)  A6 13  A7 14
#
# Reserved: GPIO19/20 are the USB D-/D+ the desktop itself runs on -- never
# assign them. GPIO26-37 are the Octal SPI flash/PSRAM lines. GPIO0/45/46
# drive the built-in RGB LED.

# --- The desktop's console -----------------------------------------------
# There is nothing to configure: the desktop is drawn to the USB
# Serial/JTAG peripheral, which is the USB-C connector. console.uart,
# console.tx, console.rx and console.baud are read by link_uart.c only and
# are ignored on this port. Close PuTTY before flashing: esptool cannot
# open the port while a terminal holds it.
#
# UART0 therefore stays free. It is on D0 (GPIO44, RX) and D1 (GPIO43, TX)
# with TX/RX as marked on the board, which makes it the natural place for a
# USB-UART adapter if a second console is ever wanted.

# --- RS-485 lines (Modbus RTU `rtu1`, `rtu2`) ----------------------------
# Each line needs its own UART in RS-485 half-duplex mode: the UART drives
# the transceiver's DE (and /RE) pin through its RTS signal. UART2 is
# available on the S3; UART1 is the safer choice if you also use UART0.
# D5/D6 (GPIO8/9) are the pair the TinyNode harness used for its LoRa
# module, so they are a known-good place to start.
#rs485.1.uart = 1
#rs485.1.tx   = 8
#rs485.1.rx   = 9
#rs485.1.de   = 10
#rs485.2.uart = 2
#rs485.2.tx   = 17
#rs485.2.rx   = 18
#rs485.2.de   = 4          # A3; 21 is the SPI SS, kept for eth.cs below

# --- W6100 Ethernet on SPI (FSPI / SPI2) -----------------------------------
# The Nano's SPI bus is D11/D12/D13 (GPIO38/47/48); a chip select has to be
# added on a free pin. eth.int = -1 polls instead of using an interrupt.
# GPIO21 is D10, the bus's hardware SS, so it is the natural chip select for
# whichever device takes that role. Ethernet and the SD card share MISO, MOSI
# and SCLK, and they need a chip select each: this is the Ethernet one, and
# `sd.cs` below is a different pin.
#eth.chip     = w6100
#eth.spi_host = 1        # SPI2_HOST (FSPI)
#eth.miso     = 47
#eth.mosi     = 38
#eth.sclk     = 48
#eth.cs       = 21
#eth.int      = 14
#eth.rst      = 13
#eth.spi_mhz  = 10
#eth.poll_ms  = 100

# --- SD card on SPI (`sd mount` puts it at /sd; `hwtest sd`) ---------------
# D2 (GPIO5) is free and next to the bus on the header. Do not put this on 21:
# it is the Ethernet chip select above, and two devices on one select answer
# together.
#sd.cs        = 5
#sd.automount = 1          # mount the card at /sd at boot
