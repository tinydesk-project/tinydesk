# Board configuration for the ESP32-C6 port (EXAMPLE).
#
# The pins below are an illustration for a generic ESP32-C6 board, not a
# particular product. Everything is commented out: with this file as it is,
# the firmware assumes a bare ESP32-C6 board (USB Serial/JTAG console, Wi-Fi,
# no RS-485, no Ethernet, no SD card).
#
# Format: one "key = value" per line; '#' starts a comment; an empty value
# ("key =") unsets a key. GPIO and UART numbers are plain numbers, -1 means
# "not connected". Keys that are missing mean "this board does not have it".
#
# How it is used:
#   * Build time: the port builds in board.conf from this folder when it
#     exists (your own wiring; board.conf is in .gitignore), otherwise this
#     example. Copy this file to board.conf and edit it.
#   * Run time: /etc/board.conf on the device (the shell's `board` command
#     creates and edits it) overrides the built-in settings; restart after a
#     change. Prebuilt release firmware contains only this example, so users
#     of it configure their board this way.
#

# --- RS-485 lines (Modbus RTU `rtu1`, `rtu2`) ----------------------------
# Each line needs its own UART in RS-485 half-duplex mode: the UART drives
# the transceiver's DE (and /RE) pin through its RTS signal. The ESP32-C6
# has UART0 and UART1 (its console is USB Serial/JTAG, so UART0 is free).
#rs485.1.uart = 1
#rs485.1.tx   = 16
#rs485.1.rx   = 17
#rs485.1.de   = 18
#rs485.2.uart = 0
#rs485.2.tx   = 21
#rs485.2.rx   = 22
#rs485.2.de   = 23

# --- W6100 Ethernet on SPI -------------------------------------------------
# eth.chip = w6100 turns it on; eth.int = -1 polls every eth.poll_ms.
#eth.chip     = w6100
#eth.spi_host = 1        # SPI2_HOST
#eth.miso     = 2
#eth.mosi     = 7
#eth.sclk     = 6
#eth.cs       = 10
#eth.int      = 11
#eth.rst      = -1
#eth.spi_mhz  = 10
#eth.poll_ms  = 100

# --- SD card on SPI (`sd mount` puts it at /sd; `hwtest sd`) ---------------
# sd.miso / sd.mosi / sd.sclk / sd.spi_host default to the eth.* values
# (a shared bus); sd.cs is its own chip select.
#sd.cs        = 19
#sd.automount = 1          # mount the card at /sd at boot

# --- Kiosk mode: one Python app on the whole screen ------------------------
# The desktop starts with the app full screen: no taskbar, Start menu,
# desktop icons or window keys, and the app is started again if it ends.
# Way out: hold the top-right corner with the mouse for 5 s, press F10
# three times within 2 s, or Ctrl+Alt+Delete (a keyboard on the board);
# root's password then leaves kiosk mode until the next restart.
# Maintenance start: press RESET, let go, then hold BOOT (GPIO9) for a moment
# within 1.5 s: the board starts without kiosk mode, this time only.
#kiosk.app       = /root/hmi.py   # a tdui script (.py or .mpy)
#kiosk.maint_pin = 9              # the BOOT button; -1: no maintenance start
