name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

env:
  # The PC programs get MQTT over TLS from upstream mbedTLS (the firmware
  # uses ESP-IDF's copy). Same 3.6 LTS branch as ESP-IDF 5.3.1 (3.6.0).
  MBEDTLS_TAG: v3.6.7

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang-format 16 check (tracked .c/.h outside third_party/)
        run: |
          python -m pip install clang-format==16.0.6
          clang-format --version
          git ls-files -z '*.c' '*.h' ':(exclude)third_party' | xargs -0 clang-format --dry-run --Werror

  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tools -p "test_*.py"

  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: mbedTLS for MQTT over TLS (the PC programs)
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch "$MBEDTLS_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls.git ../mbedtls-src
          # an absolute path CMake understands (D:/a/... on the Windows runner)
          echo "MBEDTLS_DIR=$(cd ../mbedtls-src && (pwd -W 2>/dev/null || pwd))" >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DTD_REQUIRE_TLS=ON -DTD_MBEDTLS_DIR="$MBEDTLS_DIR"
          else
            cmake -S . -B build -DTD_REQUIRE_TLS=ON -DTD_MBEDTLS_DIR="$MBEDTLS_DIR"
          fi
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end smoke test (simulated terminal + TinyDesk Shell)
        shell: bash
        run: |
          mkdir -p sim && cd sim
          ../build/tdsim wait=300 key=Enter wait=1500 'type=echo tinydesk-ok\r' wait=3000 shot > out.txt
          cat out.txt
          # the command line and its output: two lines
          test "$(grep -c "tinydesk-ok" out.txt)" -ge 2
          # MQTT over TLS must be built in: with it the connect gets as far as
          # "connection refused"; without it the shell says "not available".
          ../build/tdsim wait=300 key=Enter wait=1500 'type=mqtt connect mqtts://127.0.0.1:1\r' wait=3000 shot > tls.txt
          cat tls.txt
          if grep -q "not available in this build" tls.txt; then echo "::error::built without MQTT over TLS"; exit 1; fi
          grep -q "Connecting to mqtts://127.0.0.1:1" tls.txt

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd ports/esp32c6
          idf.py set-target esp32c6
          idf.py build
          idf.py size
      - name: Build the classic ESP32 and ESP32-S3 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          (cd ports/esp32 && idf.py build && idf.py size)
          (cd ports/esp32-4mb && idf.py build && idf.py size)
          (cd ports/esp32s3 && idf.py set-target esp32s3 && idf.py build && idf.py size)
      - name: Build the TinyDesk Shell firmware (ESP32-C6, ESP32)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          (cd third_party/tdsh && idf.py build)
          (cd third_party/tdsh/projects/esp32 && idf.py build)

  shell-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: TinyDesk Shell host build and tests (Linux; tdsh.exe on Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ninja -y
            cmake -S third_party/tdsh -B build-shell -G Ninja -DCMAKE_C_COMPILER=gcc -DTDSH_BUILD_HOST=ON
          else
            sudo apt-get install -y ninja-build
            cmake -S third_party/tdsh -B build-shell -G Ninja -DTDSH_BUILD_HOST=ON
          fi
          cmake --build build-shell
          ctest --test-dir build-shell --output-on-failure --no-tests=error
